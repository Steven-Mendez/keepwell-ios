version: 2
updates:
  - package-ecosystem: swift
    directories:
      - /Packages/DesignSystem
      - /Packages/Domain
      - /Packages/Persistence
      - /Packages/Features
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      pointfree:
        patterns: ["swift-snapshot-testing", "swift-custom-dump"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
