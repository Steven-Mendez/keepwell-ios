name: CI

# Time model: the macOS job is the only slow part (~30 minutes), so everything is built around running
# it as rarely and as briefly as possible:
#   - docs-only changes do not trigger CI;
#   - a tree is tested once: the macOS job records every tree it passes, and promotions
#     (develop -> staging -> main, pull requests included) that bring nothing new reuse that result
#     from a Linux runner (see scripts/ci-gate.sh). Pushes to develop always run the full suite;
#   - the app is compiled once: the separate build step is gone and the test steps share DerivedData.
on:
  pull_request:
    branches: [develop, staging, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - "LICENSE"
  push:
    branches: [develop, staging, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_PATH: /Applications/Xcode_27.1.app
  SIMULATOR_NAME: iPhone 17e
  # CI-only xcodebuild settings (local builds keep Xcode's defaults): no index store (nothing reads
  # it on a runner), no dSYM generation, and Xcode's compilation cache, which is keyed by content
  # (not by file dates) so it survives a fresh checkout. It lives in COMPILATION_CACHE_PATH.
  XCODEBUILD_FLAGS: COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf COMPILATION_CACHE_ENABLE_CACHING=YES
  COMPILATION_CACHE_PATH: build/DerivedData/CompilationCache.noindex

jobs:
  gate:
    name: Decide whether to test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      run_tests: ${{ steps.gate.outputs.run_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Reuse the result of an already tested tree
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: ios-ci.yml
        run: scripts/ci-gate.sh

  lint-build-test:
    name: Lint, build and tests
    needs: gate
    if: needs.gate.outputs.run_tests == 'true'
    # GitHub-hosted arm64 image with Xcode 27.x (preview label). Xcode is selected explicitly below.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install tools (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true

      - name: Lint
        run: make lint

      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Packages/*/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # Every run compiled everything from scratch (~13 minutes). The cache is saved only by pushes to
      # develop (the default branch, so every pull request can read it) and starts over each month so
      # it cannot grow without bound.
      - name: Compilation cache key
        id: xcc
        run: echo "prefix=xcc-${RUNNER_OS}-${XCODE_PATH##*/}-$(date -u +%Y-%m)-" >>"$GITHUB_OUTPUT"

      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILATION_CACHE_PATH }}
          key: ${{ steps.xcc.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.xcc.outputs.prefix }}

      - name: Boot simulator
        # Starts booting now (returns immediately) so it is ready by the time the unit tests have compiled.
        # The destination is resolved once, here, and handed to make through the environment: asking
        # simctl again while the simulator boots stalls for minutes.
        run: |
          destination="$(scripts/simulator-destination.sh)"
          udid="${destination##*id=}"
          echo "DESTINATION=$destination" >>"$GITHUB_ENV"
          echo "SIMULATOR_UDID=$udid" >>"$GITHUB_ENV"
          xcrun simctl boot "$udid" || true

      # No separate `make build` step: `test` compiles the app and the test bundles itself, so a build
      # step only compiled everything twice. (build-for-testing + test-without-building was tried and
      # dropped: the coverage report came out empty.) The UI step reuses the unit step's DerivedData.
      - name: Unit tests (with coverage)
        # `generate` runs by itself first only so the log timestamps show how long it takes.
        run: |
          make generate
          echo "generate done"
          make test-unit

      - name: UI tests (with coverage)
        id: ui
        # A runner that "hung before establishing a connection" never finishes by itself: cap the step
        # and retry once on a clean simulator. A real failure fails both attempts.
        timeout-minutes: 12
        continue-on-error: true
        env:
          XCODEBUILD_TEST_FLAGS: -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300
        run: make test-ui

      - name: UI tests (retry)
        if: steps.ui.outcome != 'success'
        timeout-minutes: 12
        env:
          XCODEBUILD_TEST_FLAGS: -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b >/dev/null
          make test-ui

      # Compiled objects are valid whatever the tests said, so a red run still refreshes the cache.
      - name: Save compilation cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILATION_CACHE_PATH }}
          key: ${{ steps.xcc.outputs.prefix }}${{ github.run_id }}

      - name: Check Package.resolved
        if: always()
        run: |
          if [ -f Keepwell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved ] && \
             ! cmp -s Package.resolved Keepwell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::warning file=Package.resolved::Package.resolved is out of date. Run 'make resolve' and commit the result."
          fi

      - name: Coverage report
        if: success()
        run: |
          rm -rf build/Results/All.xcresult
          xcrun xcresulttool merge build/Results/Unit.xcresult build/Results/UI.xcresult --output-path build/Results/All.xcresult
          xcrun xccov view --report --only-targets build/Results/All.xcresult | tee -a "$GITHUB_STEP_SUMMARY"

      # The marker scripts/ci-gate.sh looks for: this exact tree passed lint and every test.
      - name: Record the tested tree
        id: tree
        run: |
          mkdir -p build/marker
          echo "$GITHUB_SHA" >build/marker/tested-tree.txt
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"

      - name: Upload the tested tree marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: build/marker/tested-tree.txt
          overwrite: true
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: build/Results/*.xcresult
          retention-days: 7
