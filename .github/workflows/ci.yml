name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_PATH: /Applications/Xcode_27.1.app
  SIMULATOR_NAME: iPhone 17e

jobs:
  lint-build-test:
    name: Lint, build and tests
    # GitHub image with Xcode 27.x (macOS 27). Xcode is selected explicitly below.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install tools (mise)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true

      - name: Lint
        run: make lint

      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Packages/*/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Tests (unit + UI, with coverage)
        run: make test

      - name: Check Package.resolved
        if: always()
        run: |
          if [ -f Keepwell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved ] && \
             ! cmp -s Package.resolved Keepwell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::warning file=Package.resolved::Package.resolved is out of date. Run 'make resolve' and commit the result."
          fi

      - name: Coverage report
        if: success()
        run: xcrun xccov view --report --only-targets build/Results/All.xcresult | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: build/Results/*.xcresult
          retention-days: 7
