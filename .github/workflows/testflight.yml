name: TestFlight

# Manual release upload: archive the Release app and send it to TestFlight with cloud-managed signing
# (App Store Connect API key, no certificates or keychains). There is deliberately no push trigger:
# a push to main would burn a build number and ~10 macOS minutes on every merge (TestFlight builds
# are cut when you decide to, as before), and a failed upload would show up as a red main.
on:
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: Upload even if this commit has no green CI run
        type: boolean
        default: false

# Never cancel an upload in flight; a second dispatch queues behind it.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_PATH: /Applications/Xcode_27.1.app

jobs:
  check-ci:
    name: This commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a green CI run for this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          n="$(gh api "repos/$REPO/actions/workflows/ios-ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')"
          if [ "$n" -eq 0 ]; then
            echo "::error::No successful CI run for $SHA. Wait for CI, or dispatch with skip_ci_check."
            exit 1
          fi

  upload:
    name: Archive and upload
    needs: check-ci
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install tools (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true

      # Same path and key as ios-ci.yml, so releases reuse the packages CI already cached.
      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Packages/*/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make testflight

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload export logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-logs
          path: build/Export
          if-no-files-found: ignore
          retention-days: 7
